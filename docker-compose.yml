version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab51-postgres
    environment:
      POSTGRES_USER: lab51
      POSTGRES_PASSWORD: lab51_secret
      POSTGRES_DB: lab51_auth
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab51 -d lab51_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lab51-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: